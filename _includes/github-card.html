{% comment %}
  One GitHub stats image with light/dark variants and a graceful fallback.
  Colors match the site palette: plum text/icons on transparent background.
  Params: url (base endpoint), alt, width, height
{% endcomment %}
{% assign card = include %}
<figure class="stat-card" data-stat
        data-src-light="{{ card.url }}&theme=transparent&title_color=24131F&text_color=665C62&icon_color=66023C"
        data-src-dark="{{ card.url }}&theme=transparent&title_color=F3EDF1&text_color=B8AAB4&icon_color=D06A9E">
  <img src="{{ card.url }}&theme=transparent&title_color=24131F&text_color=665C62&icon_color=66023C" alt="{{ card.alt }}" width="{{ card.width }}" height="{{ card.height }}" loading="lazy" data-stat-img />
  <figcaption class="stat-fallback" hidden>
    <p>GitHub statistics are temporarily unavailable.</p>
    <a class="more-link" href="{{ site.data.profile.social.github.url }}" target="_blank" rel="noopener noreferrer">View GitHub profile →<span class="visually-hidden"> (opens in a new tab)</span></a>
  </figcaption>
</figure>
