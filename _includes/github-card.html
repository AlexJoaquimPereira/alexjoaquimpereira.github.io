{% comment %}
  One GitHub stats image with light/dark variants and a graceful fallback.
  Params: url (base endpoint), alt, width, height
{% endcomment %}
{% assign card = include %}
<figure class="stat-card" data-stat
        data-src-light="{{ card.url }}&theme=transparent&title_color=1b1b18&text_color=5b5a55&icon_color=4338ca"
        data-src-dark="{{ card.url }}&theme=transparent&title_color=e9e9ec&text_color=a3a3ab&icon_color=a5b4fc">
  <img src="{{ card.url }}&theme=transparent&title_color=1b1b18&text_color=5b5a55&icon_color=4338ca" alt="{{ card.alt }}" width="{{ card.width }}" height="{{ card.height }}" loading="lazy" data-stat-img />
  <figcaption class="stat-fallback" hidden>
    <p>GitHub statistics are temporarily unavailable.</p>
    <a class="more-link" href="{{ site.data.profile.social.github.url }}" target="_blank" rel="noopener noreferrer">View GitHub profile →<span class="visually-hidden"> (opens in a new tab)</span></a>
  </figcaption>
</figure>
