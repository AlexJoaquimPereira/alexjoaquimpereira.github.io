<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { /* stay on default */ }
    })();
  </script>

  <title>Page not found — Alex Joaquim Pereira</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141419" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">AP</span>
        <span>Alex Joaquim Pereira</span>
      </a>
    </div>
  </header>

  <main class="error-page">
    <p class="muted" style="margin: 0;">404</p>
    <h1>Page not found</h1>
    <p class="muted" style="max-width: 36ch;">
      The page you're looking for doesn't exist or has moved.
    </p>
    <p>
      <a class="btn" href="/">Back to the homepage</a>
    </p>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p style="margin: 0;">© <span data-year>2026</span> Alex Joaquim Pereira</p>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
