# --- About ----------------------------------------------------
about:
  body:
    - >-
      I am a Computer Engineer graduated from GEC with a strong foundation
      in software development, test automation,
      and full-stack web applications. Driven by curiosity and a passion for
      open-source technologies, cloud computing, and Artificial Intelligence,
      I love transforming complex ideas into functional, scalable software.
    - >-
      My technical journey includes hands-on experience in both building
      and breaking software. During my time as an Engineering Intern at
      OneShield India, I focused on QA and Test Automation, writing robust
      test cases for enterprise-level software using Selenium and Cucumber.
      On the development side, I enjoy building responsive cross-platform
      applications, having developed a full-stack social networking application
      using the MERN stack and React Native.
    - >-
      Beyond coding, I thrive in fast-paced, collaborative environments.
      Whether I’m regularly tackling algorithmic challenges in competitive
      programming contests or leading a team to manage live events as a
      Coordinator for our technical festival, TECHNIX, I enjoy problem-solving
      under pressure and driving projects to success.
    - >-
      If you're interested in contributing in some open-source projects I
      work on, feel free to [get in touch](#contact).
  facts:
    education: "Computer Engineering, Goa College of Engineering, 2026"
    learning: ["AI/ML Engineering", "Agentic AI"]
    interests: ["QA and Automation", "AI/ML", "AI Security Research", "Quizzes & trivia", "Writing"]
    looking_for: "Collaboration on open-source projects"

