  - name: "Craft Anything"
    full_name: "storytold/craft-anything"
    description: >-
      Craft Anything: understand how any software works, and craft your own.
    url: "https://github.com/storytold/craft-anything"
    license: "Apache-2.0"
    merged_pr_count: 45
    prs_url: "https://github.com/storytold/craft-anything/pulls?q=is%3Apr+author%3AAlexJoaquimPereira+is%3Amerged"
    verified_at: "2026-11-14"
    featured: true
    pull_requests:
      - number: 1796
        title: "Say how many report limitations were omitted"
        url: "https://github.com/storytold/craft-anything/pull/1796"
        merged_at: "2026-11-12"
        summary: >-
          Reports now state how many distinct limitations were omitted after
          the first 30, in both the Markdown and HTML outputs.
      - number: 1795
        title: "Resolve and disclose application graph import facts"
        url: "https://github.com/storytold/craft-anything/pull/1795"
        merged_at: "2026-11-12"
        summary: >-
          The JavaScript application mapper resolves every retained import
          instead of only the first 2,000, and discloses truncated module
          facts as a partial-coverage limitation.
      - number: 1792
        title: "Report complete comparison row totals"
        url: "https://github.com/storytold/craft-anything/pull/1792"
        merged_at: "2026-11-12"
        summary: >-
          Comparison reports return complete added and removed totals and flag
          rows that hit the 2,000-row cap, rather than reporting the cut
          lengths as totals.
      - number: 456
        title: "C# operators keep their CLR names"
        url: "https://github.com/storytold/craft-anything/pull/456"
        merged_at: "2026-11-03"
        summary: >-
          The C# declaration scanner now names each operator by its CLR symbol
          (op_Equality, op_Addition, …) instead of the literal name
          “operator”, so reconstruction checks match .NET metadata.

